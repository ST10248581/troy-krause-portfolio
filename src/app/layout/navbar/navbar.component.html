<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-container">
    <a routerLink="/" class="nav-logo" (click)="closeMenu()">Troy Krause</a>
    <button class="nav-toggle" [class.active]="menuOpen" (click)="toggleMenu()" aria-label="Toggle navigation menu">
      <span class="hamburger" [style.transform]="menuOpen ? 'rotate(45deg) translateY(8px)' : 'none'"></span>
      <span class="hamburger" [style.opacity]="menuOpen ? '0' : '1'"></span>
      <span class="hamburger" [style.transform]="menuOpen ? 'rotate(-45deg) translateY(-8px)' : 'none'"></span>
    </button>
    <ul class="nav-links" [class.active]="menuOpen">
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: item.path === '/' }"
             class="nav-link"
             (click)="closeMenu()">{{ item.label }}</a>
        </li>
      }
    </ul>
  </div>
</nav>
